<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <title>Integrasi Mr. I_M</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
      #user-info { padding: 15px; background: white; border-radius: 8px; margin-bottom: 20px; font-size: 16px; border: 1px solid #ddd; }
      #admin-features { display: none; padding: 15px; background: #d4edda; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c3e6cb; }
      .container { max-width: 800px; margin: 0 auto; }
      h1 { color: #333; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📋 Integrasi Mr. I_M</h1>
      
      <div id="user-info">
        <span id="user-status">⏳ Memeriksa akses...</span>
      </div>
      
      <div id="admin-features">
        ✅ <strong>Fitur Admin Aktif</strong> - Anda memiliki akses penuh!
      </div>

      <div style="padding: 20px; background: white; border-radius: 8px; border: 1px solid #ddd;">
        <p><strong>📊 Sistem Manajemen Berkas Ukur</strong></p>
        <p>Kantor Pertanahan Kab. Tangerang</p>
        <hr>
        <p style="color: #666; font-size: 14px;">Silakan login dengan akun Google untuk mengakses data.</p>
      </div>
    </div>

    <script>
      // 🔴 GANTI URL INI DENGAN URL WEB APP ANDA!
      var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxXlVXNncBpAV9R8pzbzHfFAg1k3GjJ4S3XJ39gldr_1H8JmFBHbCgVD7uJ-K9y3DoOSA/exec';

      function checkUserStatus() {
        var statusDiv = document.getElementById('user-status');
        statusDiv.innerHTML = '⏳ Menghubungi server...';
        statusDiv.style.color = '#856404';
        
        console.log('📡 Mengirim request ke:', WEB_APP_URL + '?action=getConfig');
        
        // PAKAI FETCH, BUKAN google.script.run!
        fetch(WEB_APP_URL + '?action=getConfig')
          .then(function(response) {
            console.log('📥 Response status:', response.status);
            if (!response.ok) {
              throw new Error('HTTP error: ' + response.status);
            }
            return response.json();
          })
          .then(function(config) {
            console.log('✅ Config dari server:', config);
            
            if (config.isAdmin) {
              statusDiv.innerHTML = '✅ Login sebagai: <strong>' + config.userEmail + '</strong> (Admin)';
              statusDiv.style.color = '#155724';
              document.getElementById('admin-features').style.display = 'block';
            } else if (config.userEmail && config.userEmail !== 'Tidak terdeteksi') {
              statusDiv.innerHTML = '👤 Login sebagai: <strong>' + config.userEmail + '</strong> (Pengguna biasa)';
              statusDiv.style.color = '#004085';
            } else {
              statusDiv.innerHTML = '⚠️ Belum login. Silakan login ke akun Google Anda.';
              statusDiv.style.color = '#856404';
            }
          })
          .catch(function(error) {
            console.error('❌ Error detail:', error);
            statusDiv.innerHTML = '❌ Gagal terhubung ke server.<br><small>Error: ' + error.message + '</small>';
            statusDiv.style.color = '#721c24';
          });
      }

      // Jalankan saat halaman dimuat
      window.onload = function() {
        checkUserStatus();
      };
    </script>
  </body>
</html>
